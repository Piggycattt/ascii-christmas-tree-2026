<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#02060b" />
  <title>Python 3D ASCII Christmas Tree</title>
  <style>
    :root { color-scheme: dark; --gold:#ffd76a; --mint:#78e6c1; --ink:#edfdf8; --muted:#8ba8ad; --panel:rgba(3,10,17,.78); --line:rgba(255,220,115,.23); }
    * { box-sizing: border-box; }
    html,body { width:100%; min-height:100%; margin:0; background:#02060b; }
    body { min-height:100svh; display:grid; place-items:center; overflow:hidden; font-family:"Cascadia Mono",Consolas,"Courier New",monospace; color:var(--ink); background:radial-gradient(circle at 50% 42%,rgba(16,105,91,.16),transparent 36%),linear-gradient(180deg,#010307,#03111a); }
    .page { position:relative; width:min(100vw,56.25svh); height:min(177.7778vw,100svh); overflow:hidden; background:#02060b; box-shadow:0 0 90px rgba(21,122,103,.24); isolation:isolate; }
    video { display:block; width:100%; height:100%; object-fit:cover; background:#02060b; }
    .topbar { position:absolute; inset:0 0 auto 0; z-index:2; display:flex; justify-content:space-between; align-items:center; gap:12px; padding:max(14px,env(safe-area-inset-top)) 16px 28px; background:linear-gradient(180deg,rgba(1,5,9,.82),transparent); pointer-events:none; }
    .eyebrow { font-size:9px; line-height:1.55; letter-spacing:.16em; color:var(--mint); text-shadow:0 0 14px rgba(100,239,193,.42); }
    .badge { flex:0 0 auto; padding:7px 9px; border:1px solid rgba(120,230,193,.24); border-radius:999px; background:rgba(2,15,18,.55); color:#a8f1d7; font-size:8px; letter-spacing:.12em; }
    .panel { position:absolute; z-index:3; left:12px; right:12px; bottom:max(12px,env(safe-area-inset-bottom)); padding:11px; border:1px solid var(--line); border-radius:18px; background:var(--panel); backdrop-filter:blur(18px); box-shadow:0 18px 55px rgba(0,0,0,.32); transform:translateY(calc(100% - 53px)); transition:transform .28s ease; }
    .page:hover .panel,.panel:focus-within,.panel.open { transform:translateY(0); }
    .summary { height:31px; display:flex; align-items:center; justify-content:space-between; gap:12px; cursor:pointer; }
    .summary strong { color:var(--gold); font-size:10px; letter-spacing:.12em; }
    .time { color:var(--muted); font-size:9px; }
    .progress { height:4px; margin:10px 0 12px; overflow:hidden; border-radius:999px; background:rgba(255,255,255,.09); cursor:pointer; }
    .progress>i { display:block; width:0; height:100%; border-radius:inherit; background:linear-gradient(90deg,#4ee0ad,#ffd45e); box-shadow:0 0 16px rgba(255,210,80,.7); }
    .actions { display:grid; grid-template-columns:repeat(2,1fr); gap:7px; }
    button,a { min-height:39px; display:inline-grid; place-items:center; padding:0 11px; border:1px solid rgba(255,255,255,.12); border-radius:11px; color:var(--ink); background:rgba(255,255,255,.055); font:700 9px/1 "Cascadia Mono",Consolas,monospace; letter-spacing:.10em; text-decoration:none; cursor:pointer; }
    button:hover,a:hover,button:focus-visible,a:focus-visible { outline:none; border-color:rgba(255,215,106,.62); background:rgba(255,215,106,.12); }
    .note { margin:10px 2px 0; color:var(--muted); font-size:8px; line-height:1.7; letter-spacing:.03em; }
    @media (max-width:520px) { .panel { left:8px; right:8px; bottom:max(8px,env(safe-area-inset-bottom)); } }
  </style>
</head>
<body>
  <main class="page" aria-label="Python 3D ASCII 圣诞树动画">
    <video id="movie" poster="poster.jpg" autoplay muted loop playsinline preload="auto">
      <source src="ASCII-Christmas-Tree-web.mp4" type="video/mp4" />
      你的浏览器不支持 MP4 视频播放。
    </video>
    <header class="topbar">
      <div class="eyebrow">3D ASCII CHRISTMAS TREE<br>PYTHON MASTER RENDER</div>
      <span class="badge">1080 × 1920 // 20S</span>
    </header>
    <section class="panel" id="panel">
      <div class="summary" id="summary" aria-label="展开控制面板">
        <strong>PYTHON // NUMPY // PILLOW</strong>
        <span class="time" id="time">00:00 / 00:20</span>
      </div>
      <div class="progress" id="progress" aria-label="视频进度"><i id="bar"></i></div>
      <div class="actions">
        <button id="toggle" type="button">PAUSE</button>
        <button id="replay" type="button">REPLAY</button>
        <a href="python_ascii_tree.py" download>PYTHON 源码</a>
        <a href="interactive-preview.html">交互预览</a>
      </div>
      <p class="note">默认播放 Python 主渲染版：各树层拥有独立相位与速度，字符按深度排序；前景更亮更密、后景更暗更细，灯带在树冠前后穿插。网页交互版作为补充预览保留。</p>
    </section>
  </main>
  <script>
    const movie=document.getElementById('movie');
    const toggle=document.getElementById('toggle');
    const replay=document.getElementById('replay');
    const time=document.getElementById('time');
    const bar=document.getElementById('bar');
    const progress=document.getElementById('progress');
    const panel=document.getElementById('panel');
    const summary=document.getElementById('summary');
    const clock=(seconds)=>{const s=Math.max(0,Math.floor(seconds||0));return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;};
    const update=()=>{const duration=Number.isFinite(movie.duration)?movie.duration:20;const ratio=duration?movie.currentTime/duration:0;bar.style.width=`${Math.min(100,ratio*100)}%`;time.textContent=`${clock(movie.currentTime)} / ${clock(duration)}`;toggle.textContent=movie.paused?'PLAY':'PAUSE';};
    toggle.addEventListener('click',()=>movie.paused?movie.play():movie.pause());
    replay.addEventListener('click',()=>{movie.currentTime=0;movie.play();});
    summary.addEventListener('click',()=>panel.classList.toggle('open'));
    progress.addEventListener('click',(event)=>{if(!Number.isFinite(movie.duration))return;const rect=progress.getBoundingClientRect();movie.currentTime=Math.max(0,Math.min(1,(event.clientX-rect.left)/rect.width))*movie.duration;});
    movie.addEventListener('timeupdate',update); movie.addEventListener('loadedmetadata',update); movie.addEventListener('play',update); movie.addEventListener('pause',update);
    document.addEventListener('keydown',(event)=>{if(event.code==='Space'){event.preventDefault();toggle.click();} if(event.key.toLowerCase()==='r')replay.click();});
    movie.play().catch(()=>{toggle.textContent='PLAY';}); update();
  </script>
</body>
</html>
